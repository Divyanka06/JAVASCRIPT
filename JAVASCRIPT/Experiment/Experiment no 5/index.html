
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <p class="logo">✦ SMART SHOPPING</p>
            <h1>Cart Calculator</h1>
            <p class="subtitle">Smart shopping. Instant discounts.</p>
        </header>

        <main class="layout">

            <section class="panel">
                <h2>Products</h2>
                <div id="products"></div>
            </section>

            <section class="panel">
                <h2>🛒 Your Cart</h2>

                <div id="cartItems"></div>

                <div class="summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0.00</span>
                    </div>

                    <div class="summary-row discount">
                        <span>Discount</span>
                        <span id="discount">− ₹0.00</span>
                    </div>

                    <div class="summary-row">
                        <span>Delivery</span>
                        <span id="delivery">₹0.00</span>
                    </div>

                    <div class="summary-row total">
                        <span>Total Amount</span>
                        <span id="total">₹0.00</span>
                    </div>
                </div>

                <p id="discountMessage" class="message">
                    Add products to unlock discounts.
                </p>

                <button class="checkout" onclick="checkout()">
                    Proceed to Checkout →
                </button>

                <button class="clear-btn" onclick="clearCart()">
                    Clear Cart
                </button>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
