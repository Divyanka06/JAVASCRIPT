<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Preference Demo</title>
    <style>
        /* Modern Minimalist Design Tokens */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;

            /* Action Button Colors */
            --color-local: #0ea5e9;
            /* Vibrant Sky Blue */
            --color-session: #6366f1;
            /* Sleek Indigo */
            --color-clear: #ef4444;
            /* Alert Red */

            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        /* Dark Mode Varietals */
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            padding: 32px;
            border-radius: var(--radius);
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
            width: 360px;
            border: 1px solid var(--border);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .section {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-body);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            border-color: var(--color-local);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: transform 0.1s ease, filter 0.2s ease;
            box-sizing: border-box;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            filter: brightness(1.08);
        }

        .btn-local {
            background-color: var(--color-local);
            color: white;
        }

        .btn-session {
            background-color: var(--color-session);
            color: white;
        }

        .btn-clear {
            background-color: transparent;
            color: var(--color-clear);
            border: 1px solid var(--color-clear);
            margin-top: 10px;
        }

        .btn-clear:hover {
            background-color: rgba(239, 68, 68, 0.05);
        }

        .status-display {
            margin-top: 24px;
            font-size: 14px;
            text-align: left;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            background-color: var(--bg-body);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .status-label {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-val {
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .val-empty {
            color: var(--text-muted);
        }

        .val-active {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Divyanka Chakole 24070521149</h2>
        <h2>Theme & Storage</h2>
        <div class="subtitle">Practical layout implementation context</div>

        <!-- 1. Select Preference Theme -->
        <div class="section">
            <label for="themeSelect">Select Preference Theme</label>
            <select id="themeSelect">
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
            </select>
        </div>

        <!-- 2. Save Actions -->
        <div class="section btn-group">
            <button id="saveLocalBtn" class="btn-local">Save as Local Storage</button>
            <button id="saveSessionBtn" class="btn-session">Save as Session Storage</button>

            <!-- 3. Clear Preference -->
            <button id="clearBtn" class="btn-clear">Clear Preference</button>
        </div>

        <!-- Live Dashboard State -->
        <div class="status-display">
            <label>Live Storage Status</label>

            <div class="status-item">
                <span class="status-label">📁 localStorage</span>
                <span id="localStatus" class="status-val val-empty">Empty</span>
            </div>

            <div class="status-item">
                <span class="status-label">⏱️ sessionStorage</span>
                <span id="sessionStatus" class="status-val val-empty">Empty</span>
            </div>
        </div>
    </div>

    <script>
        const themeSelect = document.getElementById('themeSelect');
        const saveLocalBtn = document.getElementById('saveLocalBtn');
        const saveSessionBtn = document.getElementById('saveSessionBtn');
        const clearBtn = document.getElementById('clearBtn');

        const localStatus = document.getElementById('localStatus');
        const sessionStatus = document.getElementById('sessionStatus');

        function updateUI() {
            const localTheme = localStorage.getItem('userTheme');
            const sessionTheme = sessionStorage.getItem('userTheme');

            const activeTheme = localTheme || sessionTheme || 'light';
            document.documentElement.setAttribute('data-theme', activeTheme);

            themeSelect.value = activeTheme;

            // Update local storage status indicator
            if (localTheme) {
                localStatus.textContent = localTheme;
                localStatus.className = "status-val val-active";
            } else {
                localStatus.textContent = "Empty";
                localStatus.className = "status-val val-empty";
            }

            // Update session storage status indicator
            if (sessionTheme) {
                sessionStatus.textContent = sessionTheme;
                sessionStatus.className = "status-val val-active";
            } else {
                sessionStatus.textContent = "Empty";
                sessionStatus.className = "status-val val-empty";
            }
        }

        saveLocalBtn.addEventListener('click', () => {
            localStorage.setItem('userTheme', themeSelect.value);
            updateUI();
        });

        saveSessionBtn.addEventListener('click', () => {
            sessionStorage.setItem('userTheme', themeSelect.value);
            updateUI();
        });

        clearBtn.addEventListener('click', () => {
            localStorage.removeItem('userTheme');
            sessionStorage.removeItem('userTheme');
            updateUI();
        });

        window.onload = updateUI;
    </script>
</body>

</html>
