<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM To-Do List | Divyanka Chakole</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
          
            <h1>To-Do List</h1>
            <p class="subtitle">Organize your tasks. Stay productive.</p>

            <div class="student-info">
                <span><strong>Name:</strong> Divyanka Chakole</span>
                <span><strong>PRN:</strong> 24070521149</span>
            </div>
        </header>

        <!-- Add Task -->
        <section class="task-input">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="What needs to be done?"
                autocomplete="off"
            >
            <button id="addBtn">+ Add Task</button>
        </section>

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <span id="totalTasks">0</span>
                <small>Total Tasks</small>
            </div>

            <div class="stat-card">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>

            <div class="stat-card">
                <span id="pendingTasks">0</span>
                <small>Pending</small>
            </div>
        </section>

        <!-- Task List -->
        <section class="todo-section">
            <div class="section-title">
                <h2>Tasks</h2>
                <button id="clearBtn">Clear All</button>
            </div>

            <ul id="taskList">
                <!-- Tasks will be added using JavaScript -->
            </ul>

            <div id="emptyMessage" class="empty-message">
                <div class="empty-icon">✓</div>
                <h3>No tasks yet</h3>
                <p>Add your first task and start being productive!</p>
            </div>
        </section>

        

    </div>

    <script src="script.js"></script>

</body>
</html>
