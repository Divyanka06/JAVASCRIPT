<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: #0f172a;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(100%, 760px);
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            padding: 32px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            color: #1d4ed8;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #475569;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: grid;
            gap: 6px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.45);
            background: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(90deg, #2563eb, #0ea5e9);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        button[type="button"] {
            background: linear-gradient(90deg, #64748b, #94a3b8);
        }

        .message {
            margin-top: 16px;
            font-weight: 600;
            color: #475569;
        }

        .result {
            margin-top: 16px;
            padding: 16px;
            border-radius: 16px;
            background: #f1f5f9;
            color: #0f172a;
            line-height: 1.8;
        }

        .result p {
            margin: 0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Grade Calculator</h1>

        <form id="gradeForm" novalidate>
            <label>
                Student Name
                <input type="text" id="studentName" placeholder="Enter student name" required>
            </label>
            <label>
                English Marks
                <input type="number" id="englishMarks" min="0" max="100" step="1" placeholder="0-100" required>
            </label>
            <label>
                Mathematics Marks
                <input type="number" id="mathMarks" min="0" max="100" step="1" placeholder="0-100" required>
            </label>
            <label>
                Science Marks
                <input type="number" id="scienceMarks" min="0" max="100" step="1" placeholder="0-100" required>
            </label>
            <label>
                History Marks
                <input type="number" id="historyMarks" min="0" max="100" step="1" placeholder="0-100" required>
            </label>
            <label>
                Computer Marks
                <input type="number" id="computerMarks" min="0" max="100" step="1" placeholder="0-100" required>
            </label>

            <div class="actions">
                <button type="submit">Calculate Grade</button>
                <button type="button" id="resetBtn">Reset</button>
            </div>
        </form>

        <p id="message" class="message" aria-live="polite">Enter the student details to calculate the grade.</p>
        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
