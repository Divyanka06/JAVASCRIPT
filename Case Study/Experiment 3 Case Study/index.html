<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Divyanka Chakole 24070521149 </h2>
        <h2>Student Portal</h2>
        <form id="loginForm">
            <!-- Name -->
            <div class="form-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="John Doe" required>
            </div>

            <!-- Roll Number -->
            <div class="form-group">
                <label for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber" placeholder="e.g., 2024CS01" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <button type="button" id="togglePassword">Show</button>
                </div>
            </div>

            <div class="checker-box">
                <p id="length" class="invalid">Minimum 8 characters</p>
                <p id="uppercase" class="invalid">At least one uppercase letter (A-Z)</p>
                <p id="lowercase" class="invalid">At least one lowercase letter (a-z)</p>
                <p id="number" class="invalid">At least one number (0-9)</p>
                <p id="special" class="invalid">At least one special character (*, @, $, !, %, ?, &)</p>
            </div>

            <button type="submit" id="loginBtn" disabled>Log In</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
