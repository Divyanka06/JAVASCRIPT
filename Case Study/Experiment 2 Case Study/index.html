<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Online Shopping & Billing Portal</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Online Shopping Store</h1>
    <h2>Divyanka Chakole 24070521149</h2>
    <form id="billingForm">

        <fieldset>

            <legend>Customer Information</legend>

            <div class="form-grid">

                <div class="form-group">
                    <label>Customer Name:</label>
                    <input type="text" id="custName" required placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="tel" id="mobileNo" pattern="[0-9]{10}" required placeholder="10-digit mobile number">
                </div>

                <div class="form-group">
                    <label>Invoice Number:</label>
                    <input type="text" id="invoiceNo" value="INV-2026-001" readonly>
                </div>

                <div class="form-group">
                    <label>Membership Type:</label>

                    <select id="membership">
                        <option value="0">None (0% Extra Off)</option>
                        <option value="5">Silver (5% Extra Off)</option>
                        <option value="10">Gold (10% Extra Off)</option>
                    </select>

                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>Product & Charges Details</legend>

            <div class="form-grid">

                <div class="form-group">
                    <label>Product Name:</label>
                    <input type="text" id="productName" required placeholder="Organic Cashews">
                </div>

                <div class="form-group">
                    <label>Quantity (kg):</label>
                    <input type="number" id="quantityKg" step="0.1" min="0.1" required>
                </div>

                <div class="form-group">
                    <label>Rate per kg (₹):</label>
                    <input type="number" id="rateKg" min="1" required>
                </div>

                <div class="form-group">

                    <label>GST Rate (%):</label>

                    <select id="gstRate">
                        <option value="5">5%</option>
                        <option value="12">12%</option>
                        <option value="18">18%</option>
                    </select>

                </div>

                <div class="form-group">
                    <label>Packing Charges (₹):</label>
                    <input type="number" id="packingCharges" value="30">
                </div>

                <div class="form-group">

                    <label>Payment Mode:</label>

                    <select id="paymentMode">
                        <option>UPI</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>
                        <option>Cash on Delivery</option>
                    </select>

                </div>

            </div>

        </fieldset>

        <button type="submit">
            Calculate and Generate Bill
        </button>

    </form>

    <div class="invoice-output" id="invoiceSection">

        <h2>Invoice Summary</h2>

        <div class="bill-row"><span>Invoice No:</span><span id="outInv"></span></div>

        <div class="bill-row"><span>Customer:</span><span id="outName"></span></div>

        <div class="bill-row"><span>Mobile:</span><span id="outMobile"></span></div>

        <div class="bill-row"><span>Product:</span><span id="outProduct"></span></div>

        <div class="bill-row"><span>Qty & Rate:</span><span id="outQtyRate"></span></div>

        <div class="bill-row"><span>Base Amount:</span><span id="outBase"></span></div>

        <div class="bill-row"><span>Membership Discount:</span><span id="outMemberDisc"></span></div>

        <div class="bill-row"><span>GST Amount:</span><span id="outGst"></span></div>

        <div class="bill-row"><span>Packing Charges:</span><span id="outPacking"></span></div>

        <div class="bill-row"><span>Payment Mode:</span><span id="outPayMode"></span></div>

        <div class="bill-row total"><span>Final Total:</span><span id="outTotal"></span></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
