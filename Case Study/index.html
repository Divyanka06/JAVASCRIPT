<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM PIN Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Theme Toggle Button -->
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
    🌙 Dark Mode
  </button>

  <div class="card">
    <h1>ATM PIN Checker</h1>
    <form id="checkForm">
      <div class="input-group">
        <label for="pin">Enter ATM PIN</label>
        <input 
          type="password" 
          id="pin" 
          maxlength="4" 
          placeholder="••••" 
          inputmode="numeric" 
          pattern="\d{4}" 
          required 
        >
      </div>
      <button type="submit">Check</button>
    </form>
    
    <!-- Message container for JavaScript output -->
    <div id="results" class="results"></div>
  </div>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');

    // Check saved preference or system theme
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.body.classList.add('dark-mode');
      themeToggleBtn.textContent = '☀️ Light Mode';
    } else {
      themeToggleBtn.textContent = '🌙 Dark Mode';
    }

    // Toggle button event listener
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      
      themeToggleBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
  <script src="passwordChecker.js"></script>
</body>
</html>
